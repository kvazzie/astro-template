[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { typescript = { tsdk = "node_modules/typescript/lib" }, environment = "node" }

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validation = true

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-workflow.json" = ".github/workflows/*.{yml,yaml}"

[language-server.mdx-language-server]
command = "mdx-language-server"
args = ["--stdio"]

[[language]]
name = "astro"
scope = "source.astro"
injection-regex = "astro"
file-types = ["astro"]
language-servers = ["astro-ls", "typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "vscode-eslint-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "tailwindcss-ls"]
formatter = { command = "prettier" }

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }

[[language]]
name = "json"
formatter = { command = "prettier" }

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "prettier" }

[[language]]
name = "markdown"
file-types = ["md", "mdx"]
language-servers = ["marksman", "mdx-language-server"]
formatter = { command = "prettier" }
