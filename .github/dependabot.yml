version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-tooling:
        dependency-type: development
        exclude-patterns:
          - "@astrojs/*"
          - "@tailwindcss/*"
          - astro
          - daisyui
          - tailwindcss
